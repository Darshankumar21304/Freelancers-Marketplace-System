<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gigsphere_favicon_grad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A73E8" />
      <stop offset="0.5" stop-color="#A142F4" />
      <stop offset="1" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="gigsphere_favicon_ring" x1="6" y1="20" x2="58" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" />
      <stop offset="0.5" stop-color="#1A73E8" />
      <stop offset="1" stop-color="#A142F4" />
    </linearGradient>
    <filter id="gigsphere_favicon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1A73E8" flood-opacity="0.3" />
    </filter>
  </defs>
  <g filter="url(#gigsphere_favicon_glow)">
    <circle cx="32" cy="32" r="16" fill="url(#gigsphere_favicon_grad)" />
    <ellipse cx="32" cy="32" rx="26" ry="10" stroke="url(#gigsphere_favicon_ring)" stroke-width="5.5" stroke-linecap="round" transform="rotate(-30 32 32)" />
  </g>
</svg>